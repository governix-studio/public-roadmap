name: Bug report
description: Report something that is not working as expected.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please include enough detail for someone to reproduce the problem.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps that led to the problem.
      placeholder: 1. ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Add relevant browser, environment, links, or screenshots.
    validations:
      required: false
